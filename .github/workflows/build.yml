name: Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Podesi MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Instaliraj NuGet alat
        uses: nuget/setup-nuget@v2

      - name: NuGet restore (test projekat)
        run: nuget restore HOTEL_Testovi\HOTEL_Testovi.vcxproj -PackagesDirectory packages

      - name: Instaliraj vcpkg i pakete
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg.exe install cpp-httplib:x64-windows nlohmann-json:x64-windows
          C:\vcpkg\vcpkg.exe integrate install

      - name: Osvjezi vcpkg katalog
        run: |
          git -C C:\vcpkg fetch origin
          git -C C:\vcpkg checkout e456309491fd875487bf02b8a0dca76c1b1b00cc

      - name: Build solution
        run: msbuild HOTEL.slnx /p:Configuration=Release /p:Platform=x64

      - name: Pokreni testove
        shell: pwsh
        run: |
          $testExe = Get-ChildItem -Recurse -Path . -Filter "*.exe" -ErrorAction SilentlyContinue | Where-Object { $_.Name -match "Testovi" } | Select-Object -First 1
          if ($testExe) {
            Write-Host "Pokrecem direktno: $($testExe.FullName)"
            & $testExe.FullName
          } else {
            Write-Error "Nije pronadjen test .exe fajl."
            exit 1
          }
